name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        run: swift test
      - name: Build app bundle and CLI
        run: ./scripts/build-app.sh
      - name: Smoke-test the CLI
        run: |
          "build/Brim.app/Contents/Helpers/brim" help
          "build/Brim.app/Contents/Helpers/ai-island" help
      - name: Zip app
        run: cd build && ditto -c -k --keepParent "Brim.app" Brim.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Brim
          path: build/Brim.zip
